<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c3aed"/>
      <animate attributeName="x1" values="0;-1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="c1"><rect x="40" y="88" height="30" width="0"><animate attributeName="width" from="0" to="200" begin="0.3s" dur="0.6s" fill="freeze" calcMode="discrete" values="0;24;48;72;96;120;144;200"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="152" height="30" width="0"><animate attributeName="width" begin="2.0s" dur="0.9s" fill="freeze" calcMode="discrete" values="0;40;80;120;160;200;240;280;320"/></rect></clipPath>
    <clipPath id="c5"><rect x="40" y="216" height="30" width="0"><animate attributeName="width" begin="3.9s" dur="0.9s" fill="freeze" calcMode="discrete" values="0;40;80;120;160;200;240;280;320"/></rect></clipPath>
  </defs>

  <rect width="900" height="300" rx="16" fill="url(#bg)"/>
  <rect width="900" height="300" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="15.5" fill="none" stroke="url(#accent)" stroke-opacity="0.6"/>

  <!-- window chrome -->
  <circle cx="30" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="28" r="6" fill="#febc2e"/>
  <circle cx="70" cy="28" r="6" fill="#28c840"/>
  <text x="450" y="33" text-anchor="middle" font-size="13" fill="#6b7394">mobenais@42lyon: ~</text>
  <rect x="0" y="52" width="900" height="2" fill="url(#accent)" opacity="0.5"/>

  <!-- line 1 -->
  <g font-size="20">
    <text x="40" y="110" clip-path="url(#c1)"><tspan fill="#22d3ee">$</tspan><tspan fill="#e6e9f5"> whoami</tspan></text>
    <text x="40" y="142" font-size="26" font-weight="700" fill="#ffffff" opacity="0">mobenais<tspan fill="#a78bfa" font-weight="400" font-size="20">  // CS student @ 42 Lyon</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
    </text>

    <text x="40" y="174" clip-path="url(#c3)"><tspan fill="#22d3ee">$</tspan><tspan fill="#e6e9f5"> cat interests.txt</tspan></text>
    <text x="40" y="206" fill="#9aa3c7" opacity="0">low-level C · Python · simulations · games
      <animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.4s" fill="freeze"/>
    </text>

    <text x="40" y="238" clip-path="url(#c5)"><tspan fill="#22d3ee">$</tspan><tspan fill="#e6e9f5"> ls ~/projects</tspan></text>
    <text x="40" y="270" fill="#4ade80" opacity="0">shell_C  codexion  RAG  Fly-in  pac_man  …
      <animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.4s" fill="freeze"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="482" y="254" width="12" height="20" fill="#22d3ee" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.5;0.51" dur="1s" begin="5.4s" repeatCount="indefinite"/>
  </rect>

  <!-- decorative glyph -->
  <g transform="translate(770 150)" opacity="0.9">
    <circle r="62" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <text y="18" text-anchor="middle" font-size="52" font-weight="700" fill="url(#accent)">42</text>
  </g>
</svg>
